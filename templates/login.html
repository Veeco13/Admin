<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — Lunx</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script>try{var th=localStorage.getItem('mv_theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}</script>
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    .login { width: min(380px, 92vw); }
    .login h1 { margin: 0 0 4px; font-size: 22px; }
    .login form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .login input { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 10px 12px; }
  </style>
</head>
<body>
  <div class="card login">
    <div class="brand" style="color:var(--text)"><div class="logo">L</div><h1>Lunx</h1></div>
    <div class="muted">شركة أبراج انرجي ومجموعة شركاتها التابعة</div>
    <form method="post">
      {% if error %}<div class="notice err">{{ error }}</div>{% endif %}
      <input name="username" placeholder="اسم المستخدم" autofocus required>
      <input name="password" type="password" placeholder="كلمة المرور" required>
      <button class="btn primary" style="justify-content:center">دخول</button>
    </form>
  </div>
</body>
</html>
