<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNX</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/lunx-mark.svg') }}">
  <link rel="alternate icon" type="image/png" href="{{ url_for('static', filename='brand/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ asset_ver }}">
  <script>
    // تطبيق الثيم واللغة قبل الرسم لتجنب الوميض
    try {
      var th = localStorage.getItem('mv_theme'); if (th) document.documentElement.dataset.theme = th;
      var lg = localStorage.getItem('mv_lang'); if (lg === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar no-print">
    <div class="brand"><svg class="logo-mark" viewBox="0 0 54 54" aria-hidden="true"><rect width="54" height="54" rx="13" fill="var(--logo-bg)"/><path d="M17 13v28h20" fill="none" stroke="var(--logo-fg)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="18" r="4.5" fill="var(--accent)"/></svg><span class="wordmark">LUN<b>X</b></span><small id="org-name">{{ org_name }}</small></div>
    <div class="search-wrap">
      <input id="global-search" type="search" placeholder="بحث شامل: اسم، رقم مدني، جواز، لوحة، شركة…" autocomplete="off">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <button class="tb-btn" id="btn-alerts" title="مركز التنبيهات">🔔<span class="count" id="alert-count" hidden>0</span></button>
    <button class="tb-btn" id="btn-theme" title="الوضع الداكن/الفاتح">🌓</button>
    <button class="tb-btn" id="btn-lang" title="English / عربي">EN</button>
    <div style="position:relative">
      <button class="tb-btn" id="btn-user">👤 <span class="tb-label" id="user-name"></span> ▾</button>
      <div class="drop-menu" id="user-menu" hidden></div>
    </div>
  </header>
  <div class="layout">
    <nav class="navrail no-print" id="navrail"></nav>
    <main id="content"><div class="empty">جاري التحميل…</div></main>
  </div>
  <div id="side-root"></div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <input type="file" id="hidden-file" hidden>

  <script src="{{ url_for('static', filename='i18n.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/core.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/employees.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/org.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/permits.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/letters.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/importx.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/approvals.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/contract.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/recruit.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/custody.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/expenses.js') }}?v={{ asset_ver }}"></script>
  <script src="{{ url_for('static', filename='js/custody_reports.js') }}?v={{ asset_ver }}"></script>
</body>
</html>
